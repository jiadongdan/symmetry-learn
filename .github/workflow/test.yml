# .github/workflows/test.yml
name: Tests

# Trigger conditions: on every push to main branch or when creating a Pull Request
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    # Run on the latest Ubuntu system
    runs-on: ubuntu-latest

    # Strategy: test across multiple Python versions
    strategy:
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
    # Step 1: Checkout code
    - name: Checkout code
      uses: actions/checkout@v4

    # Step 2: Setup Python environment
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    # Step 3: Cache pip packages (speed up build)
    - name: Cache pip packages
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    # Step 4: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Install project dependencies
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        # Install development dependencies (including coverage)
        if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        # If setup.py exists, install this way too
        if [ -f setup.py ]; then pip install -e .[dev]; fi

    # Step 5: Run tests
    - name: Run tests
      run: |
        python scripts/run_tests.py --coverage

    # Step 6: Upload test reports (optional)
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: test-results-python-${{ matrix.python-version }}
        path: |
          coverage_report/
          coverage.xml
        retention-days: 7