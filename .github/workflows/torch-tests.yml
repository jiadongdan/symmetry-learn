name: Torch CI

on:
  pull_request:
    branches: [main]
    paths:
      - "symmlearn/**"
      - "model_packages/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/torch-tests.yml"
  push:
    branches: [main]
    paths:
      - "symmlearn/**"
      - "model_packages/**"
      - "tests/**"
      - "pyproject.toml"
      - ".github/workflows/torch-tests.yml"
  workflow_dispatch:

jobs:
  torch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and torch test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ./model_packages/symmetry_learn_default_model
          pip install -e ".[test,torch]"

      - name: Run torch tests
        run: pytest tests/ -v -m "torch"
