name: Torch CI

on:
  pull_request:
    branches: [main]
    paths:
      - "symmlearn/maps/**"
      - "symmlearn/lattice/**"
      - "tests/maps/**"
      - "pyproject.toml"
  push:
    branches: [main]
    paths:
      - "symmlearn/maps/**"
      - "symmlearn/lattice/**"
      - "tests/maps/**"
      - "pyproject.toml"
  workflow_dispatch:

jobs:
  torch-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install package and torch test dependencies
        run: pip install -e ".[test,torch]"

      - name: Run torch tests
        run: pytest tests/ -v -m "torch"
