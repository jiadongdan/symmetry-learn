[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symmetry-learn"
version = "0.1.0"
description = "Deep learning for STEM images by symmetry"
authors = [{ name = "Jiadong Dan" }]
license = { text = "MIT" }
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "scipy",
    "ase",
    "scikit-image",
    "scikit-learn",
    "spglib",
]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["."]
include = ["symmlearn*"]
